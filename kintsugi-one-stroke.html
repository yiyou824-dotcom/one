<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>金繼 · 一筆畫</title>
<style>
  :root{
    --ground-a:#17302c; --ground-b:#0b1a18;
    --metal:#e8c36b; --metal-hi:#fff0c2; --metal-lo:#9a7a2e;
    --crack:#0a1412; --ink:#e9e2d2; --ink-dim:rgba(233,226,210,.5);
    --hair:rgba(233,226,210,.18);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--ground-b);
    color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:background .6s ease;
  }
  .serif{font-family:"Songti TC","Noto Serif TC","Source Han Serif TC",Iowan Old Style,"Palatino Linotype",Georgia,serif}

  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ── 頂部 ── */
  header{
    padding:calc(var(--safe-t) + 14px) 20px 6px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    position:relative;z-index:5;
  }
  .chapter{font-size:11px;letter-spacing:.42em;color:var(--ink-dim);text-indent:.42em;line-height:1}
  .lvline{display:flex;align-items:baseline;gap:8px;margin-top:9px}
  .lvnum{font-size:30px;line-height:.9;letter-spacing:.02em;color:var(--ink)}
  .lvtot{font-size:11px;color:var(--ink-dim);letter-spacing:.16em}
  .iconbtn{
    width:40px;height:40px;flex:none;border:1px solid var(--hair);border-radius:50%;
    background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;
    transition:border-color .2s,background .2s;
  }
  .iconbtn:hover{border-color:var(--metal);background:rgba(255,255,255,.04)}
  .iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}

  /* ── 畫布 ── */
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 進度：金線 */
  .bar{height:1px;background:var(--hair);margin:0 20px;position:relative;overflow:hidden;flex:none}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--metal-lo),var(--metal));width:0;transition:width .35s cubic-bezier(.2,.7,.3,1)}

  /* ── 底部控制 ── */
  footer{
    padding:16px 20px calc(var(--safe-b) + 18px);
    display:flex;gap:10px;justify-content:center;flex:none;z-index:5;
  }
  .pill{
    flex:1;max-width:150px;height:46px;border:1px solid var(--hair);background:transparent;
    color:var(--ink);border-radius:2px;font-size:14px;letter-spacing:.18em;text-indent:.18em;
    cursor:pointer;transition:border-color .2s,color .2s,background .2s;
    font-family:inherit;
  }
  .pill:hover{border-color:var(--metal);color:var(--metal)}
  .pill:disabled{opacity:.3;cursor:default;border-color:var(--hair);color:var(--ink)}
  .pill.gold{border-color:var(--metal);color:var(--metal)}

  /* ── 提示條 ── */
  #toast{
    position:fixed;left:50%;top:calc(var(--safe-t) + 84px);transform:translate(-50%,-8px);
    background:rgba(0,0,0,.62);border:1px solid var(--hair);backdrop-filter:blur(8px);
    padding:9px 18px;font-size:12.5px;letter-spacing:.1em;border-radius:2px;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:40;white-space:nowrap;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── 過關 ── */
  #win{
    position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 45%,rgba(0,0,0,.34),rgba(0,0,0,.76));
    backdrop-filter:blur(2px);
  }
  #win.on{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{text-align:center;padding:0 32px}
  .seal{
    width:64px;height:64px;margin:0 auto 22px;border:1px solid var(--metal);
    display:grid;place-items:center;color:var(--metal);font-size:26px;
    box-shadow:0 0 30px -6px var(--metal);animation:sealin .7s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sealin{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .wtitle{font-size:22px;letter-spacing:.34em;text-indent:.34em;margin:0 0 10px}
  .wsub{font-size:12px;letter-spacing:.16em;color:var(--ink-dim);margin:0 0 30px}
  .wact{display:flex;gap:10px;justify-content:center}

  /* ── 選關 ── */
  #menu{
    position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
    background:linear-gradient(180deg,var(--ground-a),var(--ground-b));
  }
  #menu.on{display:flex;animation:fade .25s ease}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 16px) 20px 12px}
  .mtitle{font-size:15px;letter-spacing:.34em;text-indent:.34em}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;padding:8px 14px;border:1px solid var(--hair);background:transparent;color:var(--ink-dim);
    font-size:12px;letter-spacing:.14em;border-radius:2px;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .tab.on{border-color:var(--metal);color:var(--metal)}
  .tab.lock{opacity:.35}
  .grid{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 20px calc(var(--safe-b) + 24px);
    align-content:start;
  }
  .cell{
    aspect-ratio:1;border:1px solid var(--hair);background:transparent;color:var(--ink);
    font-size:15px;border-radius:2px;cursor:pointer;display:grid;place-items:center;position:relative;
    font-family:"Songti TC","Noto Serif TC",Georgia,serif;transition:border-color .2s,color .2s;
  }
  .cell.done{border-color:var(--metal);color:var(--metal);background:rgba(232,195,107,.07)}
  .cell.done::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:12px;height:1px;background:var(--metal)}
  .cell.lock{opacity:.22;cursor:default}
  .cell.cur{box-shadow:inset 0 0 0 1px var(--metal)}
  @media (min-width:520px){.grid{grid-template-columns:repeat(8,1fr);max-width:720px;margin:0 auto;width:100%}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="chapter" id="chapName">青瓷</div>
      <div class="lvline"><span class="lvnum serif" id="lvNum">1</span><span class="lvtot">/ 500</span></div>
    </div>
    <button class="iconbtn" id="btnMenu" aria-label="選關">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <div class="bar"><i id="barFill"></i></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <footer>
    <button class="pill" id="btnUndo">退一步</button>
    <button class="pill" id="btnReset">重來</button>
    <button class="pill" id="btnHint">指引</button>
  </footer>
</div>

<div id="toast"></div>

<div id="win">
  <div class="card">
    <div class="seal serif">金</div>
    <h2 class="wtitle serif" id="winTitle">已修復</h2>
    <p class="wsub" id="winSub">第 1 器 · 青瓷</p>
    <div class="wact">
      <button class="pill" id="btnAgain">再走一次</button>
      <button class="pill gold" id="btnNext">下一關</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="mhead">
    <div class="mtitle serif">選關</div>
    <button class="iconbtn" id="btnClose" aria-label="關閉">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
"use strict";
/* ══════════════════ 釉色：十器 ══════════════════ */
const CHAPTERS=[
  {name:"青瓷",a:"#17302c",b:"#0a1917",metal:"#e8c36b",hi:"#fff2c8",lo:"#8f7130",crack:"#08110f",light:false},
  {name:"天目",a:"#2a1a12",b:"#120a06",metal:"#f3d089",hi:"#fff4d4",lo:"#8f6a2c",crack:"#0d0705",light:false},
  {name:"鈞窯",a:"#282140",b:"#110d20",metal:"#cfc9ee",hi:"#ffffff",lo:"#6f6899",crack:"#0b0817",light:false},
  {name:"朱漆",a:"#3a1614",b:"#190807",metal:"#f0c36a",hi:"#fff0c6",lo:"#8e6626",crack:"#170606",light:false},
  {name:"白瓷",a:"#dcd7cb",b:"#bdb6a7",metal:"#8a5f14",hi:"#c99a33",lo:"#5d3f0b",crack:"#6d6659",light:true},
  {name:"藍釉",a:"#15263f",b:"#07101e",metal:"#dcc17a",hi:"#fff3cf",lo:"#856930",crack:"#060f19",light:false},
  {name:"柿釉",a:"#3b2110",b:"#1a0d05",metal:"#eda765",hi:"#ffdcb4",lo:"#8e5a26",crack:"#160903",light:false},
  {name:"烏金",a:"#1c1c1c",b:"#080808",metal:"#ffd86b",hi:"#fff6d0",lo:"#93761f",crack:"#0a0a0a",light:false},
  {name:"月白",a:"#25313b",b:"#0f171f",metal:"#dbe2ea",hi:"#ffffff",lo:"#7b8794",crack:"#091015",light:false},
  {name:"翡翠",a:"#113026",b:"#051a12",metal:"#f2d77a",hi:"#fff6cf",lo:"#8b7429",crack:"#04120c",light:false},
];
const TOTAL=500, PER=50;

/* ══════════════════ 關卡生成 ══════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]], DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];

function genLevel(n){
  const rng=mulberry32(((n*2654435761)>>>0)^0x9e3779b9);
  const chap=Math.floor((n-1)/PER);
  const gw=3+Math.min(4,Math.floor(chap/2.2)), gh=gw;
  const allowDiag=chap>=2;
  const t=(n-1)/(TOTAL-1);
  let target=Math.max(4,Math.min(gw*gh*2,Math.round(5+t*24+(rng()*4-2))));
  const id=(x,y)=>y*gw+x;
  let best=null;
  for(let att=0;att<200&&(!best||best.length<target*0.8);att++){
    const used=new Set(),edges=[],deg={};
    let x=Math.floor(rng()*gw),y=Math.floor(rng()*gh);
    for(let s=0;s<target;s++){
      const dirs=allowDiag?ORTH.concat(DIAG):ORTH, cands=[];
      for(const[dx,dy]of dirs){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
        const a=id(x,y),b=id(nx,ny),k=Math.min(a,b)+"-"+Math.max(a,b);
        if(used.has(k))continue;
        if(dx&&dy){const c=id(x+dx,y),d=id(x,y+dy);if(used.has(Math.min(c,d)+"-"+Math.max(c,d)))continue;}
        cands.push([nx,ny,k,a,b]);
      }
      if(!cands.length)break;
      cands.sort((p,q)=>((deg[p[4]]||0)-(deg[q[4]]||0))+(rng()-.5)*1.2);
      const p=cands[Math.floor(Math.pow(rng(),1.6)*cands.length)];
      used.add(p[2]);edges.push([p[3],p[4]]);
      deg[p[3]]=(deg[p[3]]||0)+1;deg[p[4]]=(deg[p[4]]||0)+1;
      x=p[0];y=p[1];
    }
    if(!best||edges.length>best.length)best=edges;
  }
  const nodes=[...new Set(best.flat())].sort((a,b)=>a-b);
  return {n,chap,gw,gh,edges:best,nodes};
}

/* ══════════════════ 歐拉路徑求解 ══════════════════ */
function eulerPath(start,edges){
  if(!edges.length)return[];
  const adj=new Map(),alive=edges.map(()=>true);
  edges.forEach(([a,b],i)=>{
    if(!adj.has(a))adj.set(a,[]);if(!adj.has(b))adj.set(b,[]);
    adj.get(a).push([b,i]);adj.get(b).push([a,i]);
  });
  if(!adj.has(start))return null;
  const seen=new Set([start]),st=[start];
  while(st.length){const v=st.pop();for(const[w]of adj.get(v))if(!seen.has(w)){seen.add(w);st.push(w);}}
  for(const k of adj.keys())if(!seen.has(k))return null;
  const odd=[...adj].filter(([,v])=>v.length%2).map(([k])=>k);
  if(odd.length>2||odd.length===1)return null;
  if(odd.length===2&&odd.indexOf(start)<0)return null;
  const ptr=new Map([...adj.keys()].map(k=>[k,0])),stack=[start],path=[];
  while(stack.length){
    const v=stack[stack.length-1],list=adj.get(v);let p=ptr.get(v),adv=false;
    while(p<list.length){
      const[w,i]=list[p];
      if(alive[i]){alive[i]=false;ptr.set(v,p+1);stack.push(w);adv=true;break;}
      p++;
    }
    if(!adv){ptr.set(v,p);path.push(stack.pop());}
  }
  return path.length===edges.length+1?path.reverse():null;
}

/* ══════════════════ 存檔 ══════════════════ */
const KEY="kintsugi_progress_v1";
const mem={};
const Store={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value!=null)return r.value;}}catch(e){}
    try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}
    return mem[k]??null;
  },
  async set(k,v){
    mem[k]=v;
    try{if(window.storage){await window.storage.set(k,v);return;}}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  }
};
let done=new Uint8Array(TOTAL);     // 1 = 完成
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    Store.set(KEY,JSON.stringify({d:Array.from(done).join(""),c:S.level}));
  },250);
}
async function load(){
  try{
    const raw=await Store.get(KEY);if(!raw)return;
    const o=JSON.parse(raw);
    if(o.d)for(let i=0;i<TOTAL&&i<o.d.length;i++)done[i]=o.d[i]==="1"?1:0;
    if(o.c)S.level=Math.min(TOTAL,Math.max(1,o.c|0));
  }catch(e){}
}
const maxUnlocked=()=>{let m=1;for(let i=0;i<TOTAL;i++)if(done[i])m=Math.max(m,i+2);return Math.min(TOTAL,m);};

/* ══════════════════ 狀態 ══════════════════ */
const S={
  level:1, L:null, path:[], usedKey:new Set(),
  pos:new Map(), R:12, hit:26, drag:false, usedHint:false,
  anim:{from:null,to:null,t:1}, hint:null, hintT:0,
  particles:[], craze:[], win:false, flash:0, shake:0
};
const ek=(a,b)=>Math.min(a,b)+"-"+Math.max(a,b);

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  const st=document.getElementById("stage"),r=st.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener("resize",resize);

function theme(){return CHAPTERS[S.L?S.L.chap:0];}

function layout(){
  if(!S.L)return;
  const {gw,nodes}=S.L;
  let minx=99,maxx=-1,miny=99,maxy=-1;
  for(const id of nodes){const x=id%gw,y=Math.floor(id/gw);minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);}
  const cw=maxx-minx,ch=maxy-miny;
  const pad=Math.min(W,H)*0.14+16;
  const availW=Math.max(40,W-pad*2),availH=Math.max(40,H-pad*2);
  const step=Math.min(cw?availW/cw:availW,ch?availH/ch:availH,Math.min(W,H)*0.3);
  const ox=W/2-(minx+maxx)/2*step,oy=H/2-(miny+maxy)/2*step;
  S.pos.clear();
  for(const id of nodes){const x=id%gw,y=Math.floor(id/gw);S.pos.set(id,{x:ox+x*step,y:oy+y*step});}
  S.step=step;
  S.R=Math.max(4.5,Math.min(9,step*0.09));
  S.hit=Math.max(22,step*0.44);
  // 背景冰裂紋
  const rng=mulberry32(S.L.n*7919+13);
  S.craze=[];
  for(let i=0;i<16;i++){
    let x=rng()*W,y=rng()*H,ang=rng()*Math.PI*2;const pts=[[x,y]];
    for(let j=0;j<5+rng()*5;j++){ang+=(rng()-.5)*1.3;x+=Math.cos(ang)*(24+rng()*70);y+=Math.sin(ang)*(24+rng()*70);pts.push([x,y]);}
    S.craze.push(pts);
  }
}

/* ══════════════════ 載入關卡 ══════════════════ */
function setLevel(n,keepMenu){
  S.level=Math.min(TOTAL,Math.max(1,n));
  S.L=genLevel(S.level);
  S.path=[];S.usedKey.clear();S.usedHint=false;S.win=false;
  S.anim={from:null,to:null,t:1};S.hint=null;S.hintT=0;S.particles.length=0;
  applyTheme();layout();updateHUD();
  document.getElementById("win").classList.remove("on");
  if(!keepMenu)closeMenu();
  save();
}
function applyTheme(){
  const t=theme(),r=document.documentElement.style;
  r.setProperty("--ground-a",t.a);r.setProperty("--ground-b",t.b);
  r.setProperty("--metal",t.metal);r.setProperty("--metal-hi",t.hi);r.setProperty("--metal-lo",t.lo);
  r.setProperty("--crack",t.crack);
  r.setProperty("--ink",t.light?"#2a241a":"#e9e2d2");
  r.setProperty("--ink-dim",t.light?"rgba(42,36,26,.55)":"rgba(233,226,210,.5)");
  r.setProperty("--hair",t.light?"rgba(42,36,26,.22)":"rgba(233,226,210,.18)");
  document.body.style.background=t.b;
  document.querySelector('meta[name=theme-color]').setAttribute("content",t.b);
}
function updateHUD(){
  const t=theme();
  document.getElementById("chapName").textContent=`第 ${S.L.chap+1} 器 · ${t.name}`;
  document.getElementById("lvNum").textContent=S.level;
  const p=S.L.edges.length?S.usedKey.size/S.L.edges.length:0;
  document.getElementById("barFill").style.width=(p*100)+"%";
  document.getElementById("btnUndo").disabled=S.path.length<2;
}

/* ══════════════════ 操作 ══════════════════ */
function nodeAt(px,py){
  let best=null,bd=S.hit*S.hit;
  for(const[id,p]of S.pos){const dx=p.x-px,dy=p.y-py,d=dx*dx+dy*dy;if(d<bd){bd=d;best=id;}}
  return best;
}
function hasEdge(a,b){const k=ek(a,b);return S.L.edges.some(([x,y])=>ek(x,y)===k);}
function remaining(){return S.L.edges.filter(([a,b])=>!S.usedKey.has(ek(a,b)));}

function advance(to){
  const from=S.path[S.path.length-1];
  const k=ek(from,to);
  if(S.usedKey.has(k)||!hasEdge(from,to))return false;
  S.usedKey.add(k);S.path.push(to);
  S.anim={from,to,t:0};
  S.hint=null;
  burst(S.pos.get(to),6,.6);
  updateHUD();
  if(S.usedKey.size===S.L.edges.length)winLevel();
  return true;
}
function retract(){
  if(S.path.length<2)return;
  const b=S.path.pop(),a=S.path[S.path.length-1];
  S.usedKey.delete(ek(a,b));
  S.anim={from:null,to:null,t:1};S.hint=null;
  updateHUD();
}
function startAt(id){
  S.path=[id];S.usedKey.clear();S.anim={from:null,to:null,t:1};S.hint=null;
  burst(S.pos.get(id),8,.7);updateHUD();
}

function onDown(e){
  if(S.win)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const id=nodeAt(x,y);if(id===null)return;
  S.drag=true;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  if(!S.path.length){startAt(id);return;}
  const head=S.path[S.path.length-1];
  if(id===head)return;
  if(S.path.length>=2&&id===S.path[S.path.length-2]){retract();return;}
  if(advance(id))return;
  startAt(id);
}
function onMove(e){
  if(!S.drag||S.win||!S.path.length)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const id=nodeAt(x,y);if(id===null)return;
  const head=S.path[S.path.length-1];
  if(id===head)return;
  if(S.path.length>=2&&id===S.path[S.path.length-2]){retract();return;}
  advance(id);
}
function onUp(){S.drag=false;}
cv.addEventListener("pointerdown",onDown);
cv.addEventListener("pointermove",onMove);
window.addEventListener("pointerup",onUp);
window.addEventListener("pointercancel",onUp);

/* ══════════════════ 指引 ══════════════════ */
function hint(){
  if(S.win)return;
  if(!S.path.length){
    for(const id of S.L.nodes){if(eulerPath(id,S.L.edges)){S.hint=[id,id];S.hintT=1;toast("從這一點起筆");return;}}
    return;
  }
  S.usedHint=true;
  let guard=0;
  while(guard++<200){
    const head=S.path[S.path.length-1];
    const sol=eulerPath(head,remaining());
    if(sol&&sol.length>1){S.hint=[sol[0],sol[1]];S.hintT=1;return;}
    if(S.path.length<2){startAt(S.path[0]);toast("此處無解，請換一點起筆");return;}
    retract();
    if(guard===1)toast("此路不通，已為你退回");
  }
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);
}

/* ══════════════════ 過關 ══════════════════ */
function winLevel(){
  S.win=true;S.flash=1;S.shake=1;
  done[S.level-1]=1;save();
  for(const id of S.L.nodes)burst(S.pos.get(id),5,1.2);
  setTimeout(()=>{
    const t=theme();
    document.getElementById("winTitle").textContent=S.usedHint?"已修復":"一氣呵成";
    document.getElementById("winSub").textContent=`第 ${S.level} 關 · ${t.name} · ${S.L.edges.length} 道裂痕`;
    document.getElementById("btnNext").style.display=S.level>=TOTAL?"none":"";
    document.getElementById("win").classList.add("on");
  },820);
}

/* ══════════════════ 粒子 ══════════════════ */
function burst(p,n,pw){
  if(!p)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(0.3+Math.random()*1.5)*pw;
    S.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.35,life:1,r:0.6+Math.random()*1.8});
  }
  if(S.particles.length>420)S.particles.splice(0,S.particles.length-420);
}

/* ══════════════════ 繪製 ══════════════════ */
function seamGrad(a,b,t){
  const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  g.addColorStop(0,t.lo);g.addColorStop(.38,t.metal);g.addColorStop(.62,t.hi);g.addColorStop(1,t.metal);
  return g;
}
function drawSeam(a,b,t,f){
  f=f===undefined?1:f;
  const bx=a.x+(b.x-a.x)*f,by=a.y+(b.y-a.y)*f;
  const B={x:bx,y:by};
  const w=Math.max(3.4,S.step*0.055);
  ctx.lineCap="round";ctx.lineJoin="round";
  // 外暈
  ctx.save();
  ctx.globalAlpha=t.light?.28:.5;
  ctx.shadowColor=t.metal;ctx.shadowBlur=w*3.4;
  ctx.strokeStyle=seamGrad(a,B,t);ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(bx,by);ctx.stroke();
  ctx.restore();
  // 主金線（微幅蜿蜒）
  ctx.strokeStyle=seamGrad(a,B,t);ctx.lineWidth=w;
  const mx=(a.x+bx)/2,my=(a.y+by)/2,dx=bx-a.x,dy=by-a.y,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,wob=Math.min(3.2,len*0.035);
  ctx.beginPath();ctx.moveTo(a.x,a.y);
  ctx.quadraticCurveTo(mx+nx*wob,my+ny*wob,bx,by);ctx.stroke();
  // 高光
  ctx.strokeStyle=t.hi;ctx.globalAlpha=t.light?.5:.75;ctx.lineWidth=Math.max(1,w*0.28);
  ctx.beginPath();ctx.moveTo(a.x-nx*w*.16,a.y-ny*w*.16);
  ctx.quadraticCurveTo(mx+nx*(wob-w*.16),my+ny*(wob-w*.16),bx-nx*w*.16,by-ny*w*.16);ctx.stroke();
  ctx.globalAlpha=1;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  const t=theme();
  ctx.save();
  if(S.shake>0.01){const s=S.shake*3;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);S.shake*=Math.pow(.9,dt/16);}
  ctx.clearRect(-20,-20,W+40,H+40);

  // 釉面
  const g=ctx.createRadialGradient(W*.5,H*.42,10,W*.5,H*.5,Math.max(W,H)*.78);
  g.addColorStop(0,t.a);g.addColorStop(1,t.b);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);

  // 冰裂紋
  ctx.strokeStyle=t.light?"rgba(0,0,0,.05)":"rgba(255,255,255,.045)";ctx.lineWidth=1;
  for(const pts of S.craze){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}

  if(S.L){
    const drawn=new Set(S.usedKey);
    const anim=S.anim.t<1?ek(S.anim.from,S.anim.to):null;
    // 裂痕（未走）
    ctx.lineCap="round";
    for(const[a,b]of S.L.edges){
      const k=ek(a,b);if(drawn.has(k))continue;
      const p=S.pos.get(a),q=S.pos.get(b);
      ctx.strokeStyle=t.crack;ctx.globalAlpha=t.light?.5:.85;ctx.lineWidth=Math.max(2,S.step*0.028);
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.strokeStyle=t.light?"rgba(255,255,255,.5)":"rgba(255,255,255,.06)";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.x+1,p.y+1);ctx.lineTo(q.x+1,q.y+1);ctx.stroke();
      ctx.globalAlpha=1;
    }
    // 指引
    if(S.hint&&S.hintT>0){
      S.hintT-=dt/2600;
      const[a,b]=S.hint,p=S.pos.get(a),q=S.pos.get(b);
      const pulse=.35+.4*Math.sin(now/240);
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,S.hintT))*pulse;
      ctx.strokeStyle=t.metal;ctx.lineWidth=Math.max(2,S.step*0.05);ctx.setLineDash([2,10]);ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(q.x,q.y,S.R*2.4,0,7);ctx.stroke();
      ctx.restore();
    }
    // 金繼
    for(let i=1;i<S.path.length;i++){
      const a=S.path[i-1],b=S.path[i],k=ek(a,b);
      const p=S.pos.get(a),q=S.pos.get(b);
      if(k===anim){const e=1-Math.pow(1-S.anim.t,3);drawSeam(p,q,t,e);}
      else drawSeam(p,q,t,1);
    }
    if(S.anim.t<1){S.anim.t=Math.min(1,S.anim.t+dt/170);}

    // 節點
    const visited=new Set(S.path);
    for(const[id,p]of S.pos){
      const on=visited.has(id);
      ctx.beginPath();ctx.arc(p.x,p.y,S.R*(on?1.05:.8),0,7);
      ctx.fillStyle=on?t.metal:(t.light?"rgba(60,52,38,.65)":"rgba(255,255,255,.22)");
      if(on){ctx.shadowColor=t.metal;ctx.shadowBlur=S.R*2.2;}
      ctx.fill();ctx.shadowBlur=0;
      if(on){ctx.beginPath();ctx.arc(p.x-S.R*.28,p.y-S.R*.3,S.R*.32,0,7);ctx.fillStyle=t.hi;ctx.fill();}
    }
    // 筆尖
    if(S.path.length&&!S.win){
      const p=S.pos.get(S.path[S.path.length-1]);
      const r=S.R*(2.1+Math.sin(now/420)*.32);
      ctx.strokeStyle=t.metal;ctx.globalAlpha=.55;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
      ctx.globalAlpha=.22;ctx.beginPath();ctx.arc(p.x,p.y,r*1.55,0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  // 金粉
  for(let i=S.particles.length-1;i>=0;i--){
    const q=S.particles[i];
    q.x+=q.vx*dt/16;q.y+=q.vy*dt/16;q.vy+=0.012*dt/16;q.vx*=0.985;q.life-=dt/1100;
    if(q.life<=0){S.particles.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,q.life)*(t.light?.7:.95);
    ctx.fillStyle=q.life>.6?t.hi:t.metal;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r*q.life,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 完成閃光
  if(S.flash>0.01){
    ctx.fillStyle=t.metal;ctx.globalAlpha=S.flash*(t.light?.2:.3);
    ctx.fillRect(-20,-20,W+40,H+40);ctx.globalAlpha=1;
    S.flash*=Math.pow(.9,dt/16);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}

/* ══════════════════ 選關 ══════════════════ */
let curTab=0;
function openMenu(){
  curTab=S.L.chap;buildTabs();buildGrid();
  document.getElementById("menu").classList.add("on");
}
function closeMenu(){document.getElementById("menu").classList.remove("on");}
function buildTabs(){
  const el=document.getElementById("tabs");el.innerHTML="";
  const mu=maxUnlocked();
  CHAPTERS.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===curTab?" on":"")+(i*PER+1>mu?" lock":"");
    b.textContent=`${i+1} ${c.name}`;
    b.onclick=()=>{curTab=i;buildTabs();buildGrid();};
    el.appendChild(b);
  });
}
function buildGrid(){
  const el=document.getElementById("grid");el.innerHTML="";
  const mu=maxUnlocked();
  for(let i=0;i<PER;i++){
    const n=curTab*PER+i+1;
    const b=document.createElement("button");
    const locked=n>mu;
    b.className="cell"+(done[n-1]?" done":"")+(locked?" lock":"")+(n===S.level?" cur":"");
    b.textContent=locked?"·":n;
    if(!locked)b.onclick=()=>setLevel(n);
    el.appendChild(b);
  }
  requestAnimationFrame(()=>{const c=el.querySelector(".cur");if(c)c.scrollIntoView({block:"center"});});
}

/* ══════════════════ 綁定 ══════════════════ */
document.getElementById("btnUndo").onclick=()=>{retract();};
document.getElementById("btnReset").onclick=()=>{S.path=[];S.usedKey.clear();S.hint=null;S.anim={from:null,to:null,t:1};updateHUD();};
document.getElementById("btnHint").onclick=hint;
document.getElementById("btnMenu").onclick=openMenu;
document.getElementById("btnClose").onclick=closeMenu;
document.getElementById("btnNext").onclick=()=>setLevel(S.level+1);
document.getElementById("btnAgain").onclick=()=>{document.getElementById("win").classList.remove("on");setLevel(S.level);};
window.addEventListener("keydown",e=>{
  if(e.key==="z"||e.key==="Backspace"){retract();}
  if(e.key==="r")document.getElementById("btnReset").click();
  if(e.key==="h")hint();
  if(e.key==="ArrowRight"&&S.win)setLevel(S.level+1);
});

/* ══════════════════ 啟動 ══════════════════ */
(async function(){
  await load();
  setLevel(S.level);
  resize();
  requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
